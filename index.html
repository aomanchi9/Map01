<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Map - Smart Palm GIS</title>
    
    <!-- Google Fonts: Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome ไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b131f;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(55, 65, 81, 0.6);
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 45%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Main Selection Grid (2 จังหวัดหลัก) */
        .province-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .province-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 32px; }
        }

        .province-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .province-card:hover {
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.15);
        }

        .province-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .province-icon {
            width: 65px; height: 65px;
            background: rgba(16, 185, 129, 0.12);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--accent-green);
        }

        .province-title h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .province-title span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .province-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
            flex: 1;
        }

        /* ปุ่มกดและกล่องเลือกโซนย่อย */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-main:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* เมนูย่อยสำหรับจังหวัดกระบี่ (แปลงใหญ่ A, B, C, D) */
        .sub-menu-container {
            background: rgba(11, 19, 31, 0.6);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            padding: 15px;
        }

        .sub-menu-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-amber);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn-sub {
            background: rgba(245, 158, 11, 0.1);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background: var(--accent-amber);
            color: #0b131f;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            margin-top: 20px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="badge"><i class="fa-solid fa-map-location-dot"></i> GIS & Smart Agriculture Platform</span>
            <h1>NK Map</h1>
            <p>Geography NK</p>
        </div>

        <!-- Province Cards Grid -->
        <div class="province-grid">
            
            <!-- การ์ดจังหวัดพังงา -->
            <div class="province-card">
                <div class="province-header">
                    <div class="province-icon"><i class="fa-solid fa-tree"></i></div>
                    <div class="province-title">
                        <h2>พังงา</h2>
                        <span>พื้นที่ ท้ายเหมือง</span>
                    </div>
                </div>
                <div class="province-desc">
                   
                </div>
                <div class="action-area">
                    <a href="phangnga.html" class="btn-main">
                        <i class="fa-solid fa-map"></i> เปิดแผนที่แปลงพังงา
                    </a>
                </div>
            </div>

            <!-- การ์ดจังหวัดกระบี่ -->
            <div class="province-card">
                <div class="province-header">
                    <div class="province-icon" style="color: var(--accent-amber); background: rgba(245, 158, 11, 0.12);"><i class="fa-solid fa-seedling"></i></div>
                    <div class="province-title">
                        <h2>กระบี่</h2>
                        <span>พื้นที่ อ่าวลึก</span>
                    </div>
                </div>
                <div class="province-desc">
  
                </div>
                <!-- ส่วนเลือกแปลงย่อยตามคำขอ -->
                <div class="action-area">
                    <div class="sub-menu-container">
                        <div class="sub-menu-title"><i class="fa-solid fa-layer-group"></i> กรุณาเลือกโซนแปลงย่อย</div>
                        <div class="sub-buttons">
                            <a href="krabi_a.html" class="btn-sub">แปลงใหญ่ A</a>
                            <a href="krabi_b.html" class="btn-sub">แปลงใหญ่ B</a>
                            <a href="krabi_c.html" class="btn-sub">แปลงใหญ่ C</a>
                            <a href="krabi_d.html" class="btn-sub">แปลงใหญ่ D</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 NK Map - Smart Palm Intelligence System. All rights reserved.
    </div>

</body>
</html>
