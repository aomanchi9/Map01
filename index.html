
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Map - Smart Intelligence System</title>
    
    <!-- Google Fonts: Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome ไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #060a12;
            --card-bg: rgba(13, 20, 33, 0.85);
            --card-border: rgba(16, 185, 129, 0.3);
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* เอฟเฟกต์ตารางกริดและแสงนีออนสไตล์ GIS */
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.07) 0%, transparent 70%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header ดีไซน์ใหม่สุดล้ำ */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
            position: relative;
        }

        /* เอฟเฟกต์เรดาร์สแกนจำลองสุดเท่ตรงหัวข้อ */
        .radar-hero-container {
            width: 90px; height: 90px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }

        .radar-circle {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 1px dashed rgba(6, 182, 212, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-sweep {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(16, 185, 129, 0.4) 0deg, transparent 60deg, transparent 360deg);
            animation: radarRotate 3s linear infinite;
        }

        .radar-icon-center {
            color: var(--accent-green);
            font-size: 22px;
            z-index: 2;
            filter: drop-shadow(0 0 8px var(--accent-green));
        }

        @keyframes radarRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            letter-spacing: 1px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        .header p {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Province Cards Grid */
        .province-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .province-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 30px; }
        }

        .province-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.03);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .province-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(6, 182, 212, 0.2), inset 0 0 20px rgba(6, 182, 212, 0.08);
        }

        .province-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .province-icon {
            width: 60px; height: 60px;
            background: rgba(16, 185, 129, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .province-title h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .province-title span {
            font-size: 13px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .province-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            flex: 1;
        }

        /* Action Area */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent-green), #047857);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-main:hover {
            filter: brightness(1.15);
            transform: scale(1.01);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* Sub Menu Container (สำหรับกระบี่) */
        .sub-menu-container {
            background: rgba(6, 10, 18, 0.7);
            border: 1px dashed rgba(245, 158, 11, 0.4);
            border-radius: 12px;
            padding: 12px;
        }

        .sub-menu-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-amber);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn-sub {
            background: rgba(245, 158, 11, 0.1);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background: var(--accent-amber);
            color: #060a12;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid rgba(55, 65, 81, 0.4);
            margin-top: 20px;
            font-family: monospace;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

                    <div class="radar-sweep"></div>

        <div class="province-grid">

            <div class="province-card">

                    <div class="province-title">

                <div class="action-area">

                            <a href="#" class="btn-sub" style="opacity: 0.5; cursor: not-allowed;">แปลงใหญ่ B</a>
                            <a href="#" class="btn-sub" style="opacity: 0.5; cursor: not-allowed;">แปลงใหญ่ C</a>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 NK Map - Smart Intelligence System. All rights reserved.
    </div>

</body>
</html>
